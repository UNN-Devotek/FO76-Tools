appId: com.fo76.esm-viewer
productName: FO76 ESM Viewer
directories:
  output: dist
files:
  - out/**/*
  - node_modules/**/*
asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@fo76/esm-napi/**"
npmRebuild: false
linux:
  executableName: esm-viewer
  target: AppImage
mac:
  target: dmg
win:
  target: nsis
